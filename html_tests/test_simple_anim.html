<!DOCTYPE html>
<html>
<head>
    <title>Simple Animation Test</title>
</head>
<body style="padding: 50px;">
    <div style="font-size: 24px; color: #ffffff; margin-bottom: 20px;">Animation Test</div>

    <div style="width: 200px; height: 200px; margin: 20px; background-color: #ff0000; animation: fadeIn 2s ease-in-out;"></div>
    <div style="width: 200px; height: 200px; margin: 20px; background-color: #00ff00; animation: fadeIn 2s ease-in-out;"></div>
    <div style="width: 200px; height: 200px; margin: 20px; background-color: #0000ff; animation: fadeIn 2s ease-in-out;"></div>

    <style>
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</body>
</html>
