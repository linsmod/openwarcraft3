<!DOCTYPE html>
<html>
<head>
    <title>Opacity Animation Test</title>
    <meta charset="UTF-8">
</head>
<body>
    <div style="padding: 50px;">
        <div style="font-size: 32px; color: #ffffff; margin-bottom: 30px;">Opacity Animation Test</div>

        <div style="font-size: 18px; color: #ffffff; margin: 10px 0;">Fading in elements:</div>
        <div style="width: 200px; height: 200px; margin: 20px; background-color: #ff0000; animation: fadeIn 2s ease-in-out; display: inline-block;"></div>
        <div style="width: 200px; height: 200px; margin: 20px; background-color: #00ff00; animation: fadeIn 2s ease-in-out; display: inline-block;"></div>
        <div style="width: 200px; height: 200px; margin: 20px; background-color: #0000ff; animation: fadeIn 2s ease-in-out; display: inline-block;"></div>

        <div style="font-size: 18px; color: #ffffff; margin: 30px 0 10px 0;">Pulsing animation:</div>
        <div style="width: 200px; height: 200px; margin: 20px; background-color: #ff0000; animation: pulse 3s ease-in-out infinite; display: inline-block;"></div>
        <div style="width: 200px; height: 200px; margin: 20px; background-color: #00ff00; animation: pulse 3s ease-in-out infinite; display: inline-block;"></div>
        <div style="width: 200px; height: 200px; margin: 20px; background-color: #0000ff; animation: pulse 3s ease-in-out infinite; display: inline-block;"></div>
    </div>

    <style>
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes pulse {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
    </style>
</body>
</html>
